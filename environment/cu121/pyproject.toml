[project]
name = "fast-ranker"
version = "0.1.0"
description = "Locked CUDA 12.1 environment for FAST training and planning"
requires-python = ">=3.8,<3.9"
dependencies = [
    "cycler==0.11.0",
    "fonttools==4.28.4",
    "kiwisolver==1.3.2",
    "matplotlib==3.5.1",
    "networkx==2.6.3",
    "numpy==1.21.4",
    "packaging==21.3",
    "pillow==8.4.0",
    "pyparsing==3.0.6",
    "python-dateutil==2.8.2",
    "scikit-learn==1.3.2",
    "scipy==1.7.3",
    "setuptools==58.0.4",
    "six==1.16.0",
    "torch==2.4.1",
    "torch-geometric==2.6.1",
    "tqdm==4.62.3",
    "trimesh==3.10.8",
    "wheel==0.37.0",
]

[tool.uv]
package = false
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

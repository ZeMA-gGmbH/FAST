[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-assembly-sequence"
version = "2.0.0"
description = "FAST: feasibility-aware assembly sequence planning with a Graph Transformer and RedMax validation"
readme = "README.md"
requires-python = ">=3.8,<3.9"
license = {file = "LICENSE"}
dependencies = [
  "matplotlib==3.5.1",
  "networkx==2.6.3",
  "numpy==1.21.4",
  "scikit-learn==1.3.2",
  "scipy==1.7.3",
  "sortedcontainers>=2.4",
  "torch==2.4.1",
  "torch-geometric==2.6.1",
  "tqdm==4.62.3",
  "trimesh==3.10.8",
]

[tool.setuptools.packages.find]
include = ["assets*", "fast*", "plan_sequence*", "utils*"]

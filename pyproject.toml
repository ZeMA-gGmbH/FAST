[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-assembly-sequence"
version = "0.1.0"
description = "FAST model inference with physics-checked assembly sequence planning"
readme = "README.md"
requires-python = ">=3.8,<3.9"
license = {file = "LICENSE"}
dependencies = [
  "networkx==2.6.3",
  "numpy==1.21.4",
  "scipy==1.7.3",
  "sortedcontainers>=2.4",
  "torch==1.13.1",
  "torch-geometric==2.2.0",
  "torch-scatter==2.1.0",
  "torch-sparse==0.6.16",
  "tqdm==4.62.3",
  "trimesh==3.10.8",
]

[tool.setuptools.packages.find]
include = ["assets*", "fast_network*", "plan_sequence*", "utils*"]
